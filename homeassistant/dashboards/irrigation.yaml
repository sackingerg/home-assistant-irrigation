                    - color: white
                    - font-size: 13px
                    - font-weight: bold
                tap_action:
                  action: call-service
                  service: script.irrigation_run_zone
                  service_data:
                    system: garden
                    zone: 1
                style:
                  top: 35.5%
                  left: 72%
                  width: 4.2%

              # Z2 — Blueberry-Blackberry Bed  (estimated)
              - type: custom:button-card
                entity: switch.outside_irrigation_garden_controller_zone_2_blueberry_blackberry_bed
                name: "2"
                show_icon: false
                show_name: true
