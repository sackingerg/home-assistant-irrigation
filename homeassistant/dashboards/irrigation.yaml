                        - box-shadow: "0 0 6px rgba(171,71,188,0.9)"
                  - value: "off"
                    styles:
                      card:
                        - background: "rgba(171,71,188,0.4)"
                styles:
                  card:
                    - border-radius: 50%
                    - border: "1.5px solid rgba(255,255,255,0.85)"
                    - box-shadow: none
                    - padding: 0px
                    - height: 26px
                  name:
                    - color: white
                    - font-size: 13px
                    - font-weight: bold
                tap_action:
                  action: call-service
                  service: script.irrigation_run_zone
                  service_data:
                    system: garden
                    zone: 2
                style:
                  top: 27.5%
