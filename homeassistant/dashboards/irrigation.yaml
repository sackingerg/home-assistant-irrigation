  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 3 — GARDEN  (North Side, 3 zones)
  # Full control and settings for the garden irrigation system.
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Garden Scheduling
    path: garden
    icon: mdi:sprout
    type: sections
    max_columns: 3
    sections:

      # ── GPM MONITOR STRIP (added 2026-07-06) ──────────────────────────────
      - type: grid
        column_span: 3
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.outside_irrigation_over_pump_limit
                state: "on"
            card:
              type: markdown
              content: |-
                # 🔴 OVER PUMP LIMIT

                ## {{ states('sensor.outside_irrigation_total_gpm') }} GPM — limit is {{ states('input_number.outside_pump_max_gpm') | round(1) }}

                **Running:** {{ state_attr('sensor.outside_irrigation_total_gpm', 'zones') | selectattr('on') | map(attribute='name') | join(' • ') }}
          - type: gauge
            entity: sensor.outside_irrigation_total_gpm
            name: Total Pump Load (All Systems)
            unit: GPM
            min: 0
            max: 30
            needle: true
            segments:
              - from: 0
                color: "#4caf50"
              - from: 16
                color: "#ffc107"
              - from: 20
                color: "#f44336"
          - type: glance
            title: GPM by System
            show_state: true
            entities:
              - entity: sensor.outside_irrigation_total_gpm
                name: ALL
              - entity: sensor.outside_irrigation_east_gpm
                name: East
              - entity: sensor.outside_irrigation_garden_gpm
                name: Garden
              - entity: sensor.outside_irrigation_west1_gpm
                name: West 1
              - entity: sensor.outside_irrigation_west2_gpm
                name: West 2
          - type: markdown
            title: GPM by Line — Garden
            content: |-
              {% set zs = state_attr('sensor.outside_irrigation_garden_gpm', 'zones') or [] %}
              **Garden: {{ states('sensor.outside_irrigation_garden_gpm') }} GPM now flowing**
              {% for z in zs %}
              - {{ '🔵' if z.on else '⚪' }} {{ z.name }} — **{{ z.gpm | round(1) }} GPM**{{ ' ⬅ RUNNING' if z.on }}
              {% endfor %}

      # ── STATUS & MASTER CONTROLS ──────────────────────────────────────────
      - type: grid
        column_span: 3
        cards:

          - type: markdown
            content: >
              ## 🌱 Garden Irrigation Schedule

              **Status:** {{ states('input_text.outside_garden_status') }}

              **Schedule:** {% if is_state('input_boolean.outside_garden_schedule_enabled', 'on') %}✅ Enabled{% set events = [
                state_attr('schedule.outside_garden_zone_1_schedule','next_event'),
                state_attr('schedule.outside_garden_zone_2_schedule','next_event'),
                state_attr('schedule.outside_garden_zone_3_schedule','next_event')
              ] | select('!=', none) | list %}{% if events %} · next event **{{ events | map('as_datetime') | min | as_timestamp | timestamp_custom('%a %-I:%M %p', true) }}**{% else %} · no zones scheduled yet{% endif %}{% else %}⛔ Disabled (master switch off){% endif %}

          # Master automation toggle — moved here from the Overview 2026-08-07
          - type: custom:button-card
            entity: input_boolean.outside_garden_schedule_enabled
            name: Automation
            grid_options:
              columns: 3
              rows: 2
            show_state: false
            show_label: true
            icon: mdi:shield-check
            color_type: icon
            state:
              - value: "on"
                label: "ON"
                color: "#4CAF50"
                icon: mdi:shield-check
                styles:
                  card:
                    - border: "1px solid rgba(76,175,80,0.6)"
                    - background: "rgba(76,175,80,0.12)"
                  label:
                    - color: "#4CAF50"
                  name:
                    - color: "#4CAF50"
              - value: "off"
                label: "OFF"
                color: "#F44336"
                icon: mdi:shield-off
                styles:
                  card:
                    - border: "1px solid rgba(244,67,54,0.6)"
                    - background: "rgba(244,67,54,0.12)"
                  label:
                    - color: "#F44336"
                  name:
                    - color: "#F44336"
            styles:
              card:
                - height: 110px
                - border-radius: 10px
              name:
                - font-size: 13px
              label:
                - font-size: 22px
                - font-weight: bold
            tap_action:
              action: toggle

          # Runs every ENABLED zone in numerical order, each for its own
          # Run Now duration. Gallon-max pre-flight runs first and blocks
          # the whole sequence if any zone would exceed the pump maximum.
          - type: custom:button-card
            name: Run Controller
            icon: mdi:play-box-multiple
            show_state: false
            grid_options:
              columns: 6
              rows: 2
            styles:
              card:
                - background: "linear-gradient(135deg, #1B5E20, #2E7D32)"
                - border-radius: 12px
                - height: 110px
              icon:
                - color: "#C8E6C9"
                - width: 32px
              name:
                - font-size: 17px
                - font-weight: bold
                - color: white
            tap_action:
              action: call-service
              service: script.irrigation_run_controller
              service_data:
                system: garden
            hold_action:
              action: none

          - type: custom:button-card
            entity: input_text.outside_garden_status
            name: Stop All
            show_entity_picture: true
            entity_picture: /local/Stop.png
            show_state: false
            grid_options:
              columns: 3
              rows: 2
            styles:
              entity_picture:
                - height: 120px
                - width: auto
              name:
                - font-weight: bold
            tap_action:
              action: call-service
              service: script.irrigation_stop_controller
              service_data:
                system: garden
            hold_action:
              action: more-info

      # ── SCHEDULE ──────────────────────────────────────────────────────────
      - type: grid
        column_span: 1
        cards:
          - type: markdown
            content: |-
              ## Current Schedule

              Select the zone then click the ⚙️ to set the schedule
          - type: entities
            entities:
              - type: conditional
                conditions:
                  - entity: input_boolean.outside_garden_zone_1_enabled
                    state: "on"
                row:
                  type: attribute
                  entity: schedule.outside_garden_zone_1_schedule
                  attribute: next_event
                  format: datetime
                  name: "Zone 1 — Strawberries"
                  icon: mdi:calendar-clock
              - type: conditional
                conditions:
                  - entity: input_boolean.outside_garden_zone_1_enabled
                    state: "off"
                row:
                  type: simple-entity
                  entity: input_boolean.outside_garden_zone_1_enabled
                  name: "Zone 1 — Strawberries"
                  icon: mdi:calendar-remove
              - type: conditional
                conditions:
                  - entity: input_boolean.outside_garden_zone_2_enabled
                    state: "on"
                row:
                  type: attribute
                  entity: schedule.outside_garden_zone_2_schedule
                  attribute: next_event
                  format: datetime
                  name: "Zone 2 — Blueberry-Blackberry"
                  icon: mdi:calendar-clock
              - type: conditional
                conditions:
                  - entity: input_boolean.outside_garden_zone_2_enabled
                    state: "off"
                row:
                  type: simple-entity
                  entity: input_boolean.outside_garden_zone_2_enabled
                  name: "Zone 2 — Blueberry-Blackberry"
                  icon: mdi:calendar-remove
              - type: conditional
                conditions:
                  - entity: input_boolean.outside_garden_zone_3_enabled
                    state: "on"
                row:
                  type: attribute
                  entity: schedule.outside_garden_zone_3_schedule
                  attribute: next_event
                  format: datetime
                  name: "Zone 3 — Dripper System"
                  icon: mdi:calendar-clock
              - type: conditional
                conditions:
                  - entity: input_boolean.outside_garden_zone_3_enabled
                    state: "off"
                row:
                  type: simple-entity
                  entity: input_boolean.outside_garden_zone_3_enabled
                  name: "Zone 3 — Dripper System"
                  icon: mdi:calendar-remove

          - type: markdown
            content: |
              **Weekly Pattern**

              🔴 On · ⚫ Off · 🔵 Overlapped · ⚠️ Over pump limit
              {% set zones = [('Zone 1','garden_zone_1','input_boolean.outside_garden_zone_1_enabled'), ('Zone 2','garden_zone_2','input_boolean.outside_garden_zone_2_enabled'), ('Zone 3','garden_zone_3','input_boolean.outside_garden_zone_3_enabled')] %}
              {% set day_letters = [('S','sunday'),('M','monday'),('T','tuesday'),('W','wednesday'),('T','thursday'),('F','friday'),('S','saturday')] %}
              {% for name, key, en in zones %}
              {% set active = (state_attr('sensor.irrigation_schedule_days', key) or []) if is_state(en, 'on') else [] %}
              {% set ol = (state_attr('sensor.irrigation_schedule_days', key ~ '_ol') or []) if is_state(en, 'on') else [] %}
              {% set ov = (state_attr('sensor.irrigation_schedule_days', key ~ '_ov') or []) if is_state(en, 'on') else [] %}
              {{ name }}: {% for letter, day in day_letters %}{{ '⚠️' if day in ov else ('🔵' if day in ol else ('🔴' if day in active else '⚫')) }}{{ letter }} {% endfor %}

              {% endfor %}

      # ── ZONE MAP ──────────────────────────────────────────────────────────
      # Garden-specific map (www/Property layout_garden.jpg, mine 2026-07-08):
      # 1 = strawberries bar, 2 = blueberry/blackberry beds, 3 = dripper area.
      # Marker positions matched to the drawn features.
      - type: grid
        column_span: 2
        cards:
          - type: picture-elements
            title: Zone Map
            image: /local/Property%20layout_garden.jpg
            elements:

              # Z1 — Strawberries  (estimated — adjust to actual line position)
              - type: custom:button-card
                entity: switch.outside_irrigation_garden_controller_zone_1_strawberries
                name: "1"
                show_icon: false
                show_name: true
                show_state: false
                state:
                  - value: "on"
                    styles:
                      card:
                        - background: "rgba(41,182,246,0.85)"
                        - box-shadow: "0 0 6px rgba(41,182,246,0.9)"
                  - value: "off"
                    styles:
                      card:
                        - background: "rgba(41,182,246,0.4)"
                styles:
                  card:
                    - border-radius: 50%
                    - border: "1.5px solid rgba(255,255,255,0.85)"
                    - box-shadow: none
                    - padding: 0px
                    - height: 26px
