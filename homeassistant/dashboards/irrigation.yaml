  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 5 — IRRIGATION WEST 2  (North/West Side, 6 zones, stations 7-12)
  # Full control and settings for the 6-zone west-2 irrigation system.
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Irrigation West 2
    path: west2
    icon: mdi:sprinkler
    type: sections
    max_columns: 3
    sections:

      # ── GPM MONITOR STRIP (added 2026-07-06) ──────────────────────────────
      - type: grid
        column_span: 3
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.outside_irrigation_over_pump_limit
                state: "on"
            card:
              type: markdown
              content: |-
                # 🔴 OVER PUMP LIMIT

                ## {{ states('sensor.outside_irrigation_total_gpm') }} GPM — limit is {{ states('input_number.outside_pump_max_gpm') | round(1) }}

                **Running:** {{ state_attr('sensor.outside_irrigation_total_gpm', 'zones') | selectattr('on') | map(attribute='name') | join(' • ') }}
          - type: gauge
            entity: sensor.outside_irrigation_total_gpm
            name: Total Pump Load (All Systems)
            unit: GPM
            min: 0
            max: 30
            needle: true
            segments:
              - from: 0
                color: "#4caf50"
              - from: 16
                color: "#ffc107"
              - from: 20
                color: "#f44336"
          - type: glance
            title: GPM by System
            show_state: true
            entities:
              - entity: sensor.outside_irrigation_total_gpm
                name: ALL
              - entity: sensor.outside_irrigation_east_gpm
                name: East
              - entity: sensor.outside_irrigation_garden_gpm
                name: Garden
              - entity: sensor.outside_irrigation_west1_gpm
                name: West 1
              - entity: sensor.outside_irrigation_west2_gpm
                name: West 2
          - type: markdown
            title: GPM by Line — West 2
            content: |-
              {% set zs = state_attr('sensor.outside_irrigation_west2_gpm', 'zones') or [] %}
              **West 2: {{ states('sensor.outside_irrigation_west2_gpm') }} GPM now flowing**
              {% for z in zs %}
              - {{ '🔵' if z.on else '⚪' }} {{ z.name }} — **{{ z.gpm | round(1) }} GPM**{{ ' ⬅ RUNNING' if z.on }}
              {% endfor %}
              {% if zs | selectattr('gpm', 'eq', 0) | list | count > 0 %}
              ⚠️ Lines showing 0 GPM need their value set — not yet surveyed.
              {% endif %}

      # ── STATUS & MASTER CONTROLS ──────────────────────────────────────────
      - type: grid
        column_span: 3
        cards:

          - type: markdown
            content: >
              ## 🌿 Irrigation West 2 Schedule

              **Status:** {{ states('input_text.outside_west2_status') }}

              **Schedule:** {% if is_state('input_boolean.outside_west2_schedule_enabled', 'on') %}✅ Enabled{% set events = [
                state_attr('schedule.outside_west2_zone1_schedule','next_event'),
                state_attr('schedule.outside_west2_zone2_schedule','next_event'),
                state_attr('schedule.outside_west2_zone3_schedule','next_event'),
                state_attr('schedule.outside_west2_zone4_schedule','next_event'),
                state_attr('schedule.outside_west2_zone5_schedule','next_event'),
                state_attr('schedule.outside_west2_zone6_schedule','next_event')
              ] | select('!=', none) | list %}{% if events %} · next event **{{ events | map('as_datetime') | min | as_timestamp | timestamp_custom('%a %-I:%M %p', true) }}**{% else %} · no zones scheduled yet{% endif %}{% else %}⛔ Disabled (master switch off){% endif %}

          # Master automation toggle — moved here from the Overview 2026-08-07
          - type: custom:button-card
            entity: input_boolean.outside_west2_schedule_enabled
            name: Automation
            grid_options:
              columns: 3
              rows: 2
            show_state: false
            show_label: true
            icon: mdi:shield-check
            color_type: icon
            state:
              - value: "on"
                label: "ON"
                color: "#4CAF50"
                icon: mdi:shield-check
                styles:
                  card:
                    - border: "1px solid rgba(76,175,80,0.6)"
                    - background: "rgba(76,175,80,0.12)"
                  label:
                    - color: "#4CAF50"
                  name:
                    - color: "#4CAF50"
              - value: "off"
                label: "OFF"
                color: "#F44336"
                icon: mdi:shield-off
                styles:
                  card:
                    - border: "1px solid rgba(244,67,54,0.6)"
                    - background: "rgba(244,67,54,0.12)"
                  label:
                    - color: "#F44336"
                  name:
                    - color: "#F44336"
            styles:
              card:
                - height: 110px
                - border-radius: 10px
              name:
                - font-size: 13px
