                icon: mdi:shield-check
                styles:
                  card:
                    - border: "1px solid rgba(76,175,80,0.6)"
                    - background: "rgba(76,175,80,0.12)"
                  label:
                    - color: "#4CAF50"
                  name:
                    - color: "#4CAF50"
              - value: "off"
                label: "OFF"
                color: "#F44336"
                icon: mdi:shield-off
                styles:
                  card:
                    - border: "1px solid rgba(244,67,54,0.6)"
                    - background: "rgba(244,67,54,0.12)"
                  label:
                    - color: "#F44336"
                  name:
                    - color: "#F44336"
            styles:
              card:
                - height: 110px
                - border-radius: 10px
              name:
                - font-size: 13px
              label:
                - font-size: 22px
                - font-weight: bold
            tap_action:
              action: toggle

