# ─────────────────────────────────────────────────────────────────────────────
# VERSION: 1.01  (2026-08-17)
#   1.01  Overview header shows live controller firmware version, and flags a
#         mismatch between boards
#   1.00  baseline at the time versioning was introduced
#
# VERSIONING RULE: any modification bumps VERSION by >= 0.01, bug fixes included.
# ─────────────────────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────────────────────
# IRRIGATION DASHBOARD — ALL SYSTEMS
# File: dashboards/irrigation.yaml
#
# Registered in configuration.yaml under lovelace.dashboards as:
#   irrigation:
#     mode: yaml
#     filename: dashboards/irrigation.yaml
#     title: Irrigation
#
# VIEWS
# ─────────────────────────────────────────────────────────────────────────────
#   1. Overview                    — combined at-a-glance status for both
#                                    systems: active zones (ON/OFF per line),
#                                    automation armed/disarmed, quick Stop All
#                                    and navigation buttons
#   2. Irrigation East Scheduling  — full control + scheduling for the 6-zone
#                                    east-side system (front driveway, property
#                                    lines, flower bed, patio)
#   3. Garden Scheduling           — full control + scheduling for the 3-zone
#                                    north-side garden system (strawberries,
#                                    blueberry-blackberry, dripper)
#
# CUSTOM CARDS REQUIRED (install via HACS)
# ─────────────────────────────────────────────────────────────────────────────
#   custom:button-card  — used for Stop All buttons, navigation buttons,
#                         zone map tap targets, and the Automation ON/OFF
#                         status cards in the Overview
#
# PACKAGE FILES THAT BACK THIS DASHBOARD
# ─────────────────────────────────────────────────────────────────────────────
#   packages/irrigation_zone_engine.yaml
#     The zone registry (all 21 zones) and the four generic scripts every
#     button on this dashboard calls. Consolidated here 2026-08-10; the
#     controllers no longer own any script of their own.
#
#   packages/irrigation_east.yaml · irrigation_garden.yaml ·
#   packages/irrigation_west1.yaml · irrigation_west2.yaml
#     Per-controller HELPERS only — enable booleans, Run Now durations,
#     countdown timers, status text. No behaviour.
#
#   packages/scheduling_core.yaml
#     Single generic reactor automation that covers all 9 zones across both
#     controllers. Listens to schedule.* helper transitions and maps each to
#     its physical switch via three dicts (schedule_switch_map,
#     schedule_enable_map, schedule_master_map). Also reconciles valve state
#     on HA restart. Onboarding a new zone requires only adding one line to
#     each dict and one entry to the trigger list — no new automation needed.
#
# SCRIPTS
# ─────────────────────────────────────────────────────────────────────────────
# All four controllers share ONE implementation, in
# packages/irrigation_zone_engine.yaml. Every button below passes a controller
# key (east | garden | west1 | west2) plus a zone number — there are no
# per-controller scripts any more (consolidated 2026-08-10).
#
#   script.irrigation_run_zone         (system, zone[, run_minutes])
#     Backs every "Run Now" button and every zone-map dot. Arms the controller's
#     duration number, opens the valve, then WAITS for the valve to close rather
#     than closing it on a timer. mode: parallel.
#
#   script.irrigation_stop_zone        (system, zone)
#     Backs every per-zone "Stop" button. Closes the valve, cancels the
#     countdown, and zeroes the controller's duration number so the firmware
#     refuses to reopen the zone until HA re-arms it.
#
#   script.irrigation_stop_controller  (system)
#     Backs each page's "Stop All" button. Same three actions, every zone on
#     that controller, plus it halts any sequential run.
#
#   script.irrigation_sequential_run   (system)
#     Runs one controller's ENABLED zones in numerical order. Manual only —
#     reached through irrigation_run_controller, never by the schedule reactor.
#
#   script.irrigation_run_controller            (irrigation_zone_engine.yaml)
#     Backs the "Run Controller" button on each of the four controller pages.
#     Prices every ENABLED zone against input_number.outside_pump_max_gpm
#     first; if any zone would put the pump over its cap it blocks the whole
#     sequence, names the conflicting zones in a persistent notification (the
#     OK button dismisses it) and runs nothing. Otherwise it hands off to that
#     script.irrigation_sequential_run, which opens the enabled zones in
#     numerical order for their own "Run Now Duration" minutes each.
#
#   script.irrigation_stop_all_systems          (irrigation_zone_engine.yaml)
#     Backs the single "STOP ALL IRRIGATION" button on the Overview. Kills
#     every sequence on all four controllers, cancels all 21 zone timers and
#     closes all 21 valves. Deliberately does NOT disarm the master schedule
#     switches — see the Automation button note below.
#
# LAYOUT NOTES  (changed 2026-08-07)
# ─────────────────────────────────────────────────────────────────────────────
#   • The per-system "Automation ON/OFF" buttons no longer live on the
#     Overview. Each one moved to its own controller page, where it replaced
#     the "Schedule Enabled (master)" row that used to sit in the Current
#     Schedule card. One master control per system, on that system's page.
#   • The four "Stop <system> Zones" buttons were removed from the Overview and
#     replaced by the single STOP ALL IRRIGATION button. Each controller page
#     keeps its own Stop All, and each zone card keeps its own Stop button.
#   • Every zone's grid section carries `background:` in that zone's accent
#     colour at 14% opacity, so the zone header, its schedule/timer/duration
#     rows and its Run Now / Stop buttons read as one block. HA sections have
#     no border option — a tinted panel is the native equivalent.
#
# MASTER TOGGLES  (arm / disarm the schedule reactor per system)
# ─────────────────────────────────────────────────────────────────────────────
#   input_boolean.outside_irrigation_schedule_enabled   East system master — shown as
#                                               ON/OFF button in Overview and
#                                               as a toggle in East Schedule /
#                                               System State cards
#   input_boolean.outside_garden_schedule_enabled       Garden system master — same
#                                               pattern
#
# PER-ZONE MUTE TOGGLES  (exclude one zone from its schedule without
#                          disarming the whole system)
# ─────────────────────────────────────────────────────────────────────────────
#   input_boolean.outside_irrigation_zone_1_enabled … irrigation_zone_6_enabled
#   input_boolean.outside_garden_zone_1_enabled … garden_zone_3_enabled
#
# ZONE SWITCHES  (ESPHome physical valves — controlled by the reactor and
#                 the Run Now scripts; also read directly in Overview templates)
# ─────────────────────────────────────────────────────────────────────────────
#   switch.outside_irrigation_east_zone_1_front_driveway
#   switch.outside_irrigation_east_zone_2_east_property_line
#   switch.outside_irrigation_east_zone_3_driveway_east
#   switch.outside_irrigation_east_zone_4_southeast_property_line
#   switch.outside_irrigation_east_zone_5_east_side_flower_bed
#   switch.outside_irrigation_east_zone_6_east_patio
#   switch.outside_irrigation_garden_controller_zone_1_strawberries
#   switch.outside_irrigation_garden_controller_zone_2_blueberry_blackberry_bed
#   switch.outside_irrigation_garden_controller_zone_3_dripper_system
#
# SCHEDULE HELPERS  (UI-created weekly grid helpers — MUST be created in
#                    Settings → Helpers, not in YAML; YAML-defined schedule
#                    entities disable the "add block" editor control)
# ─────────────────────────────────────────────────────────────────────────────
#   schedule.outside_zone_1_schedule_front_driveway
#   schedule.outside_zone_2_schedule
#   schedule.outside_zone_3_schedule
#   schedule.outside_zone_4_schedule
#   schedule.outside_zone_5_schedule
#   schedule.outside_zone_6_schedule
#   schedule.outside_garden_zone_1_schedule
#   schedule.outside_garden_zone_2_schedule
#   schedule.outside_garden_zone_3_schedule
#
# DURATION INPUTS  (minutes; used only by manual Run Now — scheduled runs
#                   use the schedule block's own start/end time)
# ─────────────────────────────────────────────────────────────────────────────
#   input_number.outside_irrigation_zone_1_duration … irrigation_zone_6_duration
#   input_number.outside_garden_zone_1_duration … garden_zone_3_duration
#
# STATUS TEXT  (human-readable last-action string written by scripts)
# ─────────────────────────────────────────────────────────────────────────────
#   input_text.outside_irrigation_status   East system current status / last action
#   input_text.outside_garden_status       Garden system current status / last action
#
# TIMERS  (per-zone visible countdown during manual Run Now; one per valve)
# ─────────────────────────────────────────────────────────────────────────────
#   timer.outside_irrigation_zone_1_timer … irrigation_zone_6_timer
#   timer.outside_garden_zone_1_timer … garden_zone_3_timer
#
# SENSORS
# ─────────────────────────────────────────────────────────────────────────────
#   sensor.irrigation_schedule_days
#     Template sensor (defined in scheduling_core.yaml) that computes which
#     days of the week each zone is scheduled to run. Used by the Weekly
#     Pattern markdown in the Schedule cards to render the day-of-week grid.
#
#   sensor.outside_irrigation_east_irrigation_east_wifi_signal
#   sensor.outside_irrigation_east_irrigation_east_uptime
#   sensor.outside_irrigation_east_irrigation_east_esphome_version
#     Diagnostic sensors from the Irrigation East ESPHome node.
#
#   sensor.outside_irrigation_garden_controller_irrigation_garden_controller_wifi_signal
#   sensor.outside_irrigation_garden_controller_irrigation_garden_controller_uptime
#   sensor.outside_irrigation_garden_controller_irrigation_garden_controller_esphome_version
#     Diagnostic sensors from the Garden Controller ESPHome node.
# ─────────────────────────────────────────────────────────────────────────────

title: Irrigation
views:

  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 1 — OVERVIEW
  # At-a-glance status of both irrigation systems. Shows active zones,
  # next scheduled watering, and quick Stop All buttons.
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Overview
    path: overview
    icon: mdi:water-pump
    type: sections
    max_columns: 2
    sections:

      # ── GPM MONITOR STRIP (added 2026-07-06) ──────────────────────────
      # Live pump-load monitor: over-limit banner, total gauge, per-system
      # glance, all-21-line GPM list. Monitor only — never blocks a zone.
      - type: grid
        column_span: 2
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.outside_irrigation_over_pump_limit
                state: "on"
            card:
              type: markdown
              content: |-
                # 🔴 OVER PUMP LIMIT

                ## {{ states('sensor.outside_irrigation_total_gpm') }} GPM — limit is {{ states('input_number.outside_pump_max_gpm') | round(1) }}

                **Running:** {{ state_attr('sensor.outside_irrigation_total_gpm', 'zones') | selectattr('on') | map(attribute='name') | join(' • ') }}
          - type: gauge
            entity: sensor.outside_irrigation_total_gpm
            name: Total Pump Load (All Systems)
            unit: GPM
            min: 0
            max: 30
            needle: true
            segments:
              - from: 0
                color: "#4caf50"
              - from: 16
                color: "#ffc107"
              - from: 20
                color: "#f44336"
          - type: glance
            title: GPM by System
            show_state: true
            entities:
              - entity: sensor.outside_irrigation_total_gpm
                name: ALL
              - entity: sensor.outside_irrigation_east_gpm
                name: East
              - entity: sensor.outside_irrigation_garden_gpm
                name: Garden
              - entity: sensor.outside_irrigation_west1_gpm
                name: West 1
              - entity: sensor.outside_irrigation_west2_gpm
                name: West 2

      # ── COMBINED STATUS HEADER ─────────────────────────────────────────
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            content: |
              ## 💧 All Irrigation Systems

              {% set east_active = [
                is_state('switch.outside_irrigation_east_zone_1_front_driveway','on')|int,
                is_state('switch.outside_irrigation_east_zone_2_east_property_line','on')|int,
                is_state('switch.outside_irrigation_east_zone_3_driveway_east','on')|int,
                is_state('switch.outside_irrigation_east_zone_4_southeast_property_line','on')|int,
                is_state('switch.outside_irrigation_east_zone_5_east_side_flower_bed','on')|int,
                is_state('switch.outside_irrigation_east_zone_6_east_patio','on')|int
              ] | sum %}
              {% set garden_active = [
                is_state('switch.outside_irrigation_garden_controller_zone_1_strawberries','on')|int,
                is_state('switch.outside_irrigation_garden_controller_zone_2_blueberry_blackberry_bed','on')|int,
                is_state('switch.outside_irrigation_garden_controller_zone_3_dripper_system','on')|int
              ] | sum %}
              {% set west1_active = [
                is_state('switch.outside_irrigation_west1_controller_zone_1_south_center_a','on')|int,
                is_state('switch.outside_irrigation_west1_controller_zone_2_south_center_b','on')|int,
                is_state('switch.outside_irrigation_west1_controller_zone_3_south_center_c','on')|int,
                is_state('switch.outside_irrigation_west1_controller_zone_4_southwest','on')|int,
                is_state('switch.outside_irrigation_west1_controller_zone_5_west_center','on')|int,
                is_state('switch.outside_irrigation_west1_controller_zone_6_far_west_edge','on')|int
              ] | sum %}
              {% set west2_active = [
                is_state('switch.outside_irrigation_west2_controller_zone_1_near_shed','on')|int,
                is_state('switch.outside_irrigation_west2_controller_zone_2_north_of_house','on')|int,
                is_state('switch.outside_irrigation_west2_controller_zone_3_north_top_edge','on')|int,
                is_state('switch.outside_irrigation_west2_controller_zone_4_far_west','on')|int,
                is_state('switch.outside_irrigation_west2_controller_zone_5_station_11','on')|int,
                is_state('switch.outside_irrigation_west2_controller_zone_6_center_west','on')|int
              ] | sum %}
              {% set total = east_active + garden_active + west1_active + west2_active %}
              {% if total == 0 %}
              **All zones idle** — no irrigation running.
              {% else %}
              **Active:** {% if east_active > 0 %}{{ east_active }} east{% endif %}{% if garden_active > 0 %}{% if east_active > 0 %}, {% endif %}{{ garden_active }} garden{% endif %}{% if west1_active > 0 %}{% if east_active + garden_active > 0 %}, {% endif %}{{ west1_active }} west 1{% endif %}{% if west2_active > 0 %}{% if east_active + garden_active + west1_active > 0 %}, {% endif %}{{ west2_active }} west 2{% endif %} zone{{ 's' if total > 1 }} running.
              {% endif %}

              {# ── Controller firmware version ───────────────────────────────
                 Read LIVE from each board's Config Revision sensor rather than
                 hard-coded, so this reports what is actually ON THE CHIPS. The
                 boards are meant to run identical code, so anything other than
                 one shared version is a fault worth seeing here. #}
              {% set revs = [
                states('sensor.outside_irrigation_east_config_revision'),
                states('sensor.outside_irrigation_garden_controller_config_revision'),
                states('sensor.outside_irrigation_west1_controller_config_revision'),
                states('sensor.outside_irrigation_west2_controller_config_revision')
              ] %}
              {% set live = revs | reject('eq','unknown') | reject('eq','unavailable') | list %}
              {% set uniq = live | unique | list %}
              {% if uniq | count == 1 and live | count == 4 %}
              🟢 **Firmware v{{ uniq[0] }}** — all 4 controllers
              {% elif uniq | count == 0 %}
              ⚫ Firmware version unknown — no controller reporting
              {% else %}
              ⚠️ **Firmware mismatch** — East {{ revs[0] }} · Garden {{ revs[1] }} · West 1 {{ revs[2] }} · West 2 {{ revs[3] }}
              {% endif %}


      # ── STOP ALL IRRIGATION (added 2026-08-07) ─────────────────────────
      # Halts every sequence on all four controllers, cancels all 21 timers
      # and closes all 21 valves. Does NOT disarm the master schedule
      # switches — those live on each controller's own page now.
      - type: grid
        column_span: 2
        cards:
          - type: custom:button-card
            name: STOP ALL IRRIGATION
            icon: mdi:stop-circle-outline
            show_state: false
            grid_options:
              columns: 12
              rows: 2
            styles:
              card:
                - background: "linear-gradient(135deg, #B71C1C, #C62828)"
                - border-radius: 12px
                - height: 84px
                - border: "2px solid #FF5252"
              icon:
                - color: "#FFCDD2"
                - width: 36px
              name:
                - font-size: 21px
                - font-weight: bold
                - color: white
                - letter-spacing: "0.5px"
            tap_action:
              action: call-service
              service: script.irrigation_stop_all_systems
            hold_action:
              action: none

      # ── IRRIGATION east ─────────────────────────────────────────────────
      - type: grid
        column_span: 1
        cards:

          - type: markdown
            content: |
              ### 🌿 Irrigation East  *(East Side — 6 zones)*

              **Schedule:** {% if is_state('input_boolean.outside_irrigation_schedule_enabled', 'on') %}✅ Enabled
              {%- set events = [
                state_attr('schedule.outside_zone_1_schedule_front_driveway','next_event'),
                state_attr('schedule.outside_zone_2_schedule','next_event'),
                state_attr('schedule.outside_zone_3_schedule','next_event'),
                state_attr('schedule.outside_zone_4_schedule','next_event'),
                state_attr('schedule.outside_zone_5_schedule','next_event'),
                state_attr('schedule.outside_zone_6_schedule','next_event')
              ] | reject('none') | list %}
              {%- if events %} · next **{{ events | map('as_datetime') | min | as_timestamp | timestamp_custom('%a %-I:%M %p', true) }}**{% else %} · no zones scheduled{% endif %}
              {% else %}⛔ Disabled{% endif %}

          - type: markdown
            content: |
              **Zones Currently Running**
              Zone 1 · Front Driveway: **{{ 'ON' if is_state('switch.outside_irrigation_east_zone_1_front_driveway', 'on') else 'OFF' }}**
              Zone 2 · East Property Line: **{{ 'ON' if is_state('switch.outside_irrigation_east_zone_2_east_property_line', 'on') else 'OFF' }}**
              Zone 3 · Driveway East: **{{ 'ON' if is_state('switch.outside_irrigation_east_zone_3_driveway_east', 'on') else 'OFF' }}**
              Zone 4 · SE Property Line: **{{ 'ON' if is_state('switch.outside_irrigation_east_zone_4_southeast_property_line', 'on') else 'OFF' }}**
              Zone 5 · East Flower Bed: **{{ 'ON' if is_state('switch.outside_irrigation_east_zone_5_east_side_flower_bed', 'on') else 'OFF' }}**
              Zone 6 · East Patio: **{{ 'ON' if is_state('switch.outside_irrigation_east_zone_6_east_patio', 'on') else 'OFF' }}**


          - type: custom:button-card
            name: Open Irrigation East Scheduling
            icon: mdi:arrow-right-circle
            styles:
              card:
                - border-radius: 10px
                - height: 44px
                - background: "#1E3A5F"
              icon:
                - color: "#90CAF9"
              name:
                - color: "#90CAF9"
                - font-weight: bold
            tap_action:
              action: navigate
              navigation_path: /irrigation-all/east
      # ── GARDEN CONTROLLER ────────────────────────────────────────────────
      - type: grid
        column_span: 1
        cards:

          - type: markdown
            content: |
              ### 🌱 Garden  *(North Side — 3 zones)*

              **Schedule:** {% if is_state('input_boolean.outside_garden_schedule_enabled', 'on') %}✅ Enabled
              {%- set events = [
                state_attr('schedule.outside_garden_zone_1_schedule','next_event'),
                state_attr('schedule.outside_garden_zone_2_schedule','next_event'),
                state_attr('schedule.outside_garden_zone_3_schedule','next_event')
              ] | reject('none') | list %}
              {%- if events %} · next **{{ events | map('as_datetime') | min | as_timestamp | timestamp_custom('%a %-I:%M %p', true) }}**{% else %} · no zones scheduled{% endif %}
              {% else %}⛔ Disabled{% endif %}

          - type: markdown
            content: |
              **Zones Currently Running**
              Zone 1 · Strawberries: **{{ 'ON' if is_state('switch.outside_irrigation_garden_controller_zone_1_strawberries', 'on') else 'OFF' }}**
              Zone 2 · Blueberry-Blackberry: **{{ 'ON' if is_state('switch.outside_irrigation_garden_controller_zone_2_blueberry_blackberry_bed', 'on') else 'OFF' }}**
              Zone 3 · Dripper System: **{{ 'ON' if is_state('switch.outside_irrigation_garden_controller_zone_3_dripper_system', 'on') else 'OFF' }}**


          - type: custom:button-card
            name: Open Garden Irrigation Scheduling
            icon: mdi:arrow-right-circle
            styles:
              card:
                - border-radius: 10px
                - height: 44px
                - background: "#1B3A2F"
              icon:
                - color: "#A5D6A7"
              name:
                - color: "#A5D6A7"
                - font-weight: bold
            tap_action:
              action: navigate
              navigation_path: /irrigation-all/garden

      # ── IRRIGATION WEST 1 ────────────────────────────────────────────────
      - type: grid
        column_span: 1
        cards:

          - type: markdown
            content: |
              ### 🌾 Irrigation West 1  *(South/West — 6 zones)*

              **Schedule:** {% if is_state('input_boolean.outside_west1_schedule_enabled', 'on') %}✅ Enabled
              {%- set events = [
                state_attr('schedule.outside_west1_zone1_schedule','next_event'),
                state_attr('schedule.outside_west1_zone2_schedule','next_event'),
                state_attr('schedule.outside_west1_zone3_schedule','next_event'),
                state_attr('schedule.outside_west1_zone4_schedule','next_event'),
                state_attr('schedule.outside_west1_zone5_schedule','next_event'),
                state_attr('schedule.outside_west1_zone6_schedule','next_event')
              ] | reject('none') | list %}
              {%- if events %} · next **{{ events | map('as_datetime') | min | as_timestamp | timestamp_custom('%a %-I:%M %p', true) }}**{% else %} · no zones scheduled{% endif %}
              {% else %}⛔ Disabled{% endif %}


          - type: markdown
            content: |
              **Zones Currently Running**
              Zone 1 · South Center A: **{{ 'ON' if is_state('switch.outside_irrigation_west1_controller_zone_1_south_center_a', 'on') else 'OFF' }}**
              Zone 2 · South Center B: **{{ 'ON' if is_state('switch.outside_irrigation_west1_controller_zone_2_south_center_b', 'on') else 'OFF' }}**
              Zone 3 · South Center C: **{{ 'ON' if is_state('switch.outside_irrigation_west1_controller_zone_3_south_center_c', 'on') else 'OFF' }}**
              Zone 4 · Southwest: **{{ 'ON' if is_state('switch.outside_irrigation_west1_controller_zone_4_southwest', 'on') else 'OFF' }}**
              Zone 5 · West Center: **{{ 'ON' if is_state('switch.outside_irrigation_west1_controller_zone_5_west_center', 'on') else 'OFF' }}**
              Zone 6 · Far West Edge: **{{ 'ON' if is_state('switch.outside_irrigation_west1_controller_zone_6_far_west_edge', 'on') else 'OFF' }}**


          - type: custom:button-card
            name: Open West 1 Scheduling
            icon: mdi:arrow-right-circle
            styles:
              card:
                - border-radius: 10px
                - height: 44px
                - background: "#2E3A1F"
              icon:
                - color: "#C5E1A5"
              name:
                - color: "#C5E1A5"
                - font-weight: bold
            tap_action:
              action: navigate
              navigation_path: /irrigation-all/west1

      # ── IRRIGATION WEST 2 ────────────────────────────────────────────────
      - type: grid
        column_span: 1
        cards:

          - type: markdown
            content: |
              ### 🌿 Irrigation West 2  *(North/West — 6 zones)*

              **Schedule:** {% if is_state('input_boolean.outside_west2_schedule_enabled', 'on') %}✅ Enabled
              {%- set events = [
                state_attr('schedule.outside_west2_zone1_schedule','next_event'),
                state_attr('schedule.outside_west2_zone2_schedule','next_event'),
                state_attr('schedule.outside_west2_zone3_schedule','next_event'),
                state_attr('schedule.outside_west2_zone4_schedule','next_event'),
                state_attr('schedule.outside_west2_zone5_schedule','next_event'),
                state_attr('schedule.outside_west2_zone6_schedule','next_event')
              ] | reject('none') | list %}
              {%- if events %} · next **{{ events | map('as_datetime') | min | as_timestamp | timestamp_custom('%a %-I:%M %p', true) }}**{% else %} · no zones scheduled{% endif %}
              {% else %}⛔ Disabled{% endif %}


          - type: markdown
            content: |
              **Zones Currently Running**
              Zone 1 · Near Shed: **{{ 'ON' if is_state('switch.outside_irrigation_west2_controller_zone_1_near_shed', 'on') else 'OFF' }}**
              Zone 2 · North of House: **{{ 'ON' if is_state('switch.outside_irrigation_west2_controller_zone_2_north_of_house', 'on') else 'OFF' }}**
