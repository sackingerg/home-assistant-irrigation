      # Settings section (Zone Enable Toggles) removed 2026-07-27, my decision —
      # redundant; per-zone enable is available elsewhere.

  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 6 — ZONE CONFIG (added 2026-07-07)
  # Dedicated per-zone GPM configuration page. Pick a system in the dropdown,
  # edit its zones' GPM values inline. Standard GPM monitor strip on top.
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Zone Config
    path: zone-config
    icon: mdi:tune-variant
    type: sections
    max_columns: 2
    sections:

      # ── GPM MONITOR STRIP ──────────────────────────────────────────────
      - type: grid
        column_span: 2
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.outside_irrigation_over_pump_limit
                state: "on"
            card:
              type: markdown
              content: |-
                # 🔴 OVER PUMP LIMIT

                ## {{ states('sensor.outside_irrigation_total_gpm') }} GPM — limit is {{ states('input_number.outside_pump_max_gpm') | round(1) }}

                **Running:** {{ state_attr('sensor.outside_irrigation_total_gpm', 'zones') | selectattr('on') | map(attribute='name') | join(' • ') }}
          - type: gauge
            entity: sensor.outside_irrigation_total_gpm
            name: Total Pump Load (All Systems)
            unit: GPM
            min: 0
            max: 30
            needle: true
            segments:
              - from: 0
                color: "#4caf50"
              - from: 16
                color: "#ffc107"
              - from: 20
                color: "#f44336"
          - type: glance
            title: GPM by System
            show_state: true
            entities:
              - entity: sensor.outside_irrigation_total_gpm
                name: ALL
              - entity: sensor.outside_irrigation_east_gpm
                name: East
              - entity: sensor.outside_irrigation_garden_gpm
                name: Garden
              - entity: sensor.outside_irrigation_west1_gpm
                name: West 1
              - entity: sensor.outside_irrigation_west2_gpm
                name: West 2

      # ── ZONE GPM EDITOR ────────────────────────────────────────────────
      - type: grid
        cards:
          - type: entities
            title: Pump
            icon: mdi:water-pump
            entities:
              - entity: input_number.outside_pump_max_gpm
                name: Pump Max Output
          # ── GPM EDITOR — section buttons drive input_select, which the ──
          # conditional panels below react to. Tapping the active section
          # again hides its panel (sets the selector back to Hidden).
          - type: markdown
            content: "**Select the Section to config the GPM**"
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                entity: input_select.outside_gpm_edit_system
                name: East
                show_state: false
                show_icon: false
                styles:
                  card:
                    - height: 44px
                    - border-radius: 8px
                  name:
                    - font-size: 14px
                    - font-weight: bold
                state:
                  - value: East
                    styles:
                      card:
                        - background-color: "#29B6F6"
                      name:
                        - color: white
                tap_action:
                  action: call-service
                  service: input_select.select_option
                  service_data:
                    entity_id: input_select.outside_gpm_edit_system
                    option: '[[[ return entity.state === "East" ? "Hidden" : "East"; ]]]'
              - type: custom:button-card
                entity: input_select.outside_gpm_edit_system
                name: Garden
                show_state: false
                show_icon: false
                styles:
                  card:
                    - height: 44px
                    - border-radius: 8px
                  name:
                    - font-size: 14px
                    - font-weight: bold
                state:
                  - value: Garden
                    styles:
                      card:
                        - background-color: "#29B6F6"
                      name:
                        - color: white
                tap_action:
                  action: call-service
                  service: input_select.select_option
                  service_data:
                    entity_id: input_select.outside_gpm_edit_system
                    option: '[[[ return entity.state === "Garden" ? "Hidden" : "Garden"; ]]]'
              - type: custom:button-card
                entity: input_select.outside_gpm_edit_system
                name: West 1
                show_state: false
                show_icon: false
                styles:
                  card:
                    - height: 44px
                    - border-radius: 8px
                  name:
                    - font-size: 14px
                    - font-weight: bold
                state:
                  - value: West 1
                    styles:
                      card:
                        - background-color: "#29B6F6"
                      name:
                        - color: white
                tap_action:
                  action: call-service
                  service: input_select.select_option
                  service_data:
                    entity_id: input_select.outside_gpm_edit_system
                    option: '[[[ return entity.state === "West 1" ? "Hidden" : "West 1"; ]]]'
              - type: custom:button-card
                entity: input_select.outside_gpm_edit_system
                name: West 2
                show_state: false
                show_icon: false
                styles:
                  card:
                    - height: 44px
                    - border-radius: 8px
                  name:
                    - font-size: 14px
                    - font-weight: bold
                state:
                  - value: West 2
                    styles:
                      card:
                        - background-color: "#29B6F6"
                      name:
                        - color: white
                tap_action:
                  action: call-service
                  service: input_select.select_option
                  service_data:
                    entity_id: input_select.outside_gpm_edit_system
                    option: '[[[ return entity.state === "West 2" ? "Hidden" : "West 2"; ]]]'
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.outside_gpm_edit_system
                state: East
            card:
              type: entities
              title: East — Zone GPM
              entities:
                - entity: input_number.outside_irrigation_zone_1_gpm
                  name: Z1 Front Driveway
                - entity: input_number.outside_irrigation_zone_2_gpm
                  name: Z2 East Property Line
                - entity: input_number.outside_irrigation_zone_3_gpm
                  name: Z3 Driveway East
                - entity: input_number.outside_irrigation_zone_4_gpm
                  name: Z4 Southeast Property Line
                - entity: input_number.outside_irrigation_zone_5_gpm
                  name: Z5 East Side Flower Bed
                - entity: input_number.outside_irrigation_zone_6_gpm
                  name: Z6 East Patio
                - type: divider
                - entity: sensor.outside_irrigation_east_gpm
                  name: East flowing now
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.outside_gpm_edit_system
                state: Garden
            card:
              type: entities
              title: Garden — Zone GPM
              entities:
                - entity: input_number.outside_garden_zone_1_gpm
                  name: Z1 Strawberries
                - entity: input_number.outside_garden_zone_2_gpm
                  name: Z2 Blueberry/Blackberry Bed
                - entity: input_number.outside_garden_zone_3_gpm
                  name: Z3 Dripper System
                - type: divider
                - entity: sensor.outside_irrigation_garden_gpm
                  name: Garden flowing now
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.outside_gpm_edit_system
                state: West 1
            card:
              type: entities
              title: West 1 — Zone GPM
              entities:
                - entity: input_number.outside_west1_zone_1_gpm
                  name: Z1 South Center A
                - entity: input_number.outside_west1_zone_2_gpm
                  name: Z2 South Center B
                - entity: input_number.outside_west1_zone_3_gpm
                  name: Z3 South Center C
                - entity: input_number.outside_west1_zone_4_gpm
                  name: Z4 Southwest
                - entity: input_number.outside_west1_zone_5_gpm
                  name: Z5 West Center
                - entity: input_number.outside_west1_zone_6_gpm
                  name: Z6 Far West Edge
                - type: divider
                - entity: sensor.outside_irrigation_west1_gpm
                  name: West 1 flowing now
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.outside_gpm_edit_system
                state: West 2
            card:
              type: entities
              title: West 2 — Zone GPM
              entities:
                - entity: input_number.outside_west2_zone_1_gpm
                  name: Z1 Near Shed
                - entity: input_number.outside_west2_zone_2_gpm
                  name: Z2 North of House
                - entity: input_number.outside_west2_zone_3_gpm
                  name: Z3 North Top Edge
                - entity: input_number.outside_west2_zone_4_gpm
                  name: Z4 Far West
                - entity: input_number.outside_west2_zone_5_gpm
                  name: Z5 Station 11
                - entity: input_number.outside_west2_zone_6_gpm
                  name: Z6 Center West
                - type: divider
                - entity: sensor.outside_irrigation_west2_gpm
                  name: West 2 flowing now

      # -- IRRIGATION ACTION LOG (added 2026-07-07) -----------------------
      - type: grid
        cards:
          - type: markdown
            title: Irrigation Action Log
            content: |-
              {% set e = state_attr('sensor.outside_irrigation_action_log', 'entries') or [] %}
              {% if e | count == 0 %}
              *No completed runs recorded yet.*
              {% endif %}
              {% for line in e %}
              - {{ line }}
              {% endfor %}

      # -- SYSTEM STATE (consolidated single card, 2026-07-07) -----------
      - type: grid
        cards:
          - type: entities
            title: System State
            icon: mdi:information-outline
            entities:
              - type: section
                label: East
              - entity: sensor.outside_irrigation_east_irrigation_east_wifi_signal
                name: WiFi Signal
                icon: mdi:wifi
              - entity: sensor.outside_irrigation_east_irrigation_east_uptime
                name: Uptime
                icon: mdi:clock-outline
              - type: section
                label: Garden
              - entity: sensor.outside_irrigation_garden_controller_irrigation_garden_controller_wifi_signal
                name: WiFi Signal
                icon: mdi:wifi
              - entity: sensor.outside_irrigation_garden_controller_irrigation_garden_controller_uptime
                name: Uptime
                icon: mdi:clock-outline
              - type: section
                label: West 1
              - entity: sensor.outside_irrigation_west1_controller_irrigation_west1_wifi_signal
                name: WiFi Signal
                icon: mdi:wifi
              - entity: sensor.outside_irrigation_west1_controller_irrigation_west1_uptime
                name: Uptime
                icon: mdi:clock-outline
              - type: section
                label: West 2
              - entity: sensor.outside_irrigation_west2_controller_irrigation_west2_wifi_signal
                name: WiFi Signal
                icon: mdi:wifi
              - entity: sensor.outside_irrigation_west2_controller_irrigation_west2_uptime
                name: Uptime
                icon: mdi:clock-outline
