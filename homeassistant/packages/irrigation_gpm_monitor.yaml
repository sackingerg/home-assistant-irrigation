# ─────────────────────────────────────────────────────────────────────────────
# IRRIGATION GPM MONITOR — property-wide flow visibility + over-limit warning
# Package: packages/irrigation_gpm_monitor.yaml   (created 2026-07-06)
#
# PURPOSE
# -------
# Live visibility of estimated pump load at TWO levels:
#   • per-system:  sensor.outside_irrigation_east_gpm / _garden_gpm / _west1_gpm / _west2_gpm
#   • property:    sensor.outside_irrigation_total_gpm  (sum of the four system sensors)
# plus a CLEAR WARNING (dashboard banner + persistent notification) when the
# total exceeds the 20 GPM pump limit. All sensors recompute instantly when
# any zone valve opens/closes or any GPM helper is edited.
#
# NO PHONE PUSH (my decision, 2026-07-13): pushes are banned from all irrigation
# packages — irrigation runs at night with my phone in silent mode, so they
# can never reach me. A push briefly lived here pointing at
# notify.mobile_app_<my_phone>, a service that has never existed on this box,
# which made this automation error out on every over-limit event (2026-07-14).
#
# THIS IS A MONITOR, NOT A GUARD. Nothing here ever turns a valve off or
# blocks a zone from starting. I explicitly want to be able to run
# past 20 GPM deliberately during tuning — the system's job is to make that
# state unmissable, not to prevent it.
#
# GPM VALUES ARE input_number HELPERS, NOT CONSTANTS
# ---------------------------------------------------
# Each zone's GPM estimate is an input_number so it can be corrected from the
# UI as real measurements come in — no YAML edit needed.
# NOTE: no `initial:` on purpose — values persist across HA restarts, so the
# YAML min/max/step here are bounds, not the live figures.
#
# ALL 21 ZONES NOW CARRY A NON-ZERO FIGURE (verified 2026-08-07). The earlier
# note that West 1 / West 2 were unsurveyed and reading 0 is no longer true:
#   East    16, 16, 16, 16, 15, 5
#   Garden   3, 10, 10
#   West 1  16, 16, 10, 16, 10, 16
#   West 2  16, 16, 16, 16, 16, 12
# A zone left at 0 would silently under-report the total AND pass the Run
# Controller gallon pre-flight unchallenged — if a new zone is added, set its
# GPM before scheduling it.
#
# Only the 21 sprinkler zones are counted. Any gravity-fed or separately
# supplied irrigation on the property is EXCLUDED because it does not load
# this pump. Anything that DOES draw from it needs its own entry here.
#
# STRUCTURE
# ---------
# Each per-system sensor owns its 6 (or 3) zone definitions in BOTH its state
# and its `zones` attribute template (state-based template entities can't
# share variables — keep the two lists in sync when editing). The total
# sensor only references the four system sensors, so zones are defined in
# exactly one file section per system.
# ─────────────────────────────────────────────────────────────────────────────

input_number:
  # ── PUMP CAPACITY — single dynamic source of truth for the GPM limit ───────
  # Referenced by the over-limit binary sensor, the warning automation, the
  # schedule reactor's checked-start gate, and the dashboard banner. Editable
  # from the Zone Config page. The limit rule remains "do not exceed": a total
  # EQUAL to this value is acceptable.
  outside_pump_max_gpm:
    name: "Pump Max Output (GPM)"
    min: 5
    max: 40
    step: 0.5
    unit_of_measurement: "GPM"
    icon: mdi:water-pump
    mode: box

  # ── East — GPM confirmed 2026-06-19 ────────────────────────────────────────
  outside_irrigation_zone_1_gpm:
    name: "East Z1 GPM (Front Driveway)"
    min: 0
    max: 30
    step: 0.5
    unit_of_measurement: "GPM"
    icon: mdi:waves-arrow-right
    mode: box
  outside_irrigation_zone_2_gpm:
    name: "East Z2 GPM (East Property Line)"
    min: 0
    max: 30
    step: 0.5
