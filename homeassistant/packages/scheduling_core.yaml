        - west1_zone1
        - west1_zone2
        - west1_zone3
        - west1_zone4
        - west1_zone5
        - west1_zone6
        # West 2 Controller (6 zones)
        - west2_zone1
        - west2_zone2
        - west2_zone3
        - west2_zone4
        - west2_zone5
        - west2_zone6
        # Overlap-day lists (blue dots) — one per zone, added 2026-07-08
        - zone_1_ol
        - zone_2_ol
        - zone_3_ol
        - zone_4_ol
        - zone_5_ol
