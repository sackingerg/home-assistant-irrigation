# ─────────────────────────────────────────────────────────────────────────────
# IRRIGATION WEST 2 — HA PACKAGE
# File: packages/irrigation_west2.yaml
#
# Deploy to: config/packages/irrigation_west2.yaml
# Add to configuration.yaml (if not already using wildcard includes):
#   homeassistant:
#     packages:
#       irrigation_west2: !include packages/irrigation_west2.yaml
#
# ESPHome device: irrigation_west2_controller (6-zone west-side board)
# Stations covered: old Rain Bird stations 7-10 and 12 (terminal 5 is a spare).
# Mapping CONFIRMED on the ground by me 2026-07-20:
#   Old station 7  → terminal 1 (GPIO1)    Zone 1 — Near Shed
#   Old station 8  → terminal 2 (GPIO2)    Zone 2 — North of House
#   Old station 9  → terminal 3 (GPIO41)   Zone 3 — North Top Edge
#   Old station 10 → terminal 4 (GPIO42)   Zone 4 — Far West
#   (no station)   → terminal 5 (GPIO45)   Zone 5 — UNUSED SPARE (old station 11
#                    has no valve; entity keeps its legacy "station_11" name —
#                    never rename, references would break silently)
#   Old station 12 → terminal 6 (GPIO46)   Zone 6 — Center West
#
# The Zone Map circles on the irrigation dashboard are labeled with these
# CONTROLLER ZONE numbers (1-4, 6), not legacy station numbers (my decision,
# 2026-07-20). Zone 5 has no map circle — it is a spare.
#
# All HA helper entity IDs carry the "outside_" area prefix to match the
# "outside" area assignment used across the irrigation system.
#
# SCHEDULE HELPERS — must be UI-created, not YAML:
#   Go to Settings → Helpers → + Add Helper → Schedule, assign to area "outside":
#     schedule.outside_west2_zone1_schedule  (Zone 1 — Near Shed)
#     schedule.outside_west2_zone2_schedule  (Zone 2 — North of House)
#     schedule.outside_west2_zone3_schedule  (Zone 3 — North Top Edge)
#     schedule.outside_west2_zone4_schedule  (Zone 4 — Far West)
#     schedule.outside_west2_zone5_schedule  (Zone 5 — Station 11)
#     schedule.outside_west2_zone6_schedule  (Zone 6 — Center West)
#
# SCHEDULING CORE — add to packages/scheduling_core.yaml:
#   In schedule_switch_map:
#     "schedule.outside_west2_zone1_schedule": "switch.outside_irrigation_west2_controller_zone_1_near_shed"
#     "schedule.outside_west2_zone2_schedule": "switch.outside_irrigation_west2_controller_zone_2_north_of_house"
#     "schedule.outside_west2_zone3_schedule": "switch.outside_irrigation_west2_controller_zone_3_north_top_edge"
#     "schedule.outside_west2_zone4_schedule": "switch.outside_irrigation_west2_controller_zone_4_far_west"
#     "schedule.outside_west2_zone5_schedule": "switch.outside_irrigation_west2_controller_zone_5_station_11"
#     "schedule.outside_west2_zone6_schedule": "switch.outside_irrigation_west2_controller_zone_6_center_west"
#   In schedule_enable_map:
#     "schedule.outside_west2_zone1_schedule": "input_boolean.outside_west2_zone_1_enabled"
#     ... (same pattern for zones 2-6)
#   In schedule_master_map:
#     "schedule.outside_west2_zone1_schedule": "input_boolean.outside_west2_schedule_enabled"
#     ... (same pattern for zones 2-6)
#   In trigger list: add platform: state entries for all 6 outside_west2 schedule entities
#
# RESOLVED 2026-07-20: Zone 5 confirmed as an unused spare (old station 11 has
# no valve). Do not schedule it; keep its enable toggle off. If a new valve is
# ever landed on terminal 5, update the header mapping above and add a map
# circle labeled "5".
# ─────────────────────────────────────────────────────────────────────────────

