    name: "West 1 Zone 6 Timer"
    icon: mdi:timer-sand
    restore: false

# NOTE: this package no longer defines any scripts.
# ───────────────────────────────────────────────────────────────────────────
# The three scripts that used to live here — west1_run_single_zone, west1_stop_all, west1_sequential_run —
# were removed 2026-08-10 and replaced by ONE generic implementation in
# packages/irrigation_zone_engine.yaml:
#
#     script.irrigation_run_zone         (system, zone[, run_minutes])
#     script.irrigation_stop_zone        (system, zone)
#     script.irrigation_stop_controller  (system)
#     script.irrigation_sequential_run   (system)
#
# WHY: four hand-maintained copies of the same logic had drifted. West 1 and
# West 2 ended a manual run with an unconditional switch.turn_off after a
# plain delay; East and Garden did not. Because the script was mode: parallel,
# each "Run Now" press left a delayed shutoff behind that cut short whatever
# run was in progress when it fired — a 15-minute run measured 10m44s on
# 2026-08-10. One implementation means no controller can drift again.
#
# This file now owns only this controller's HELPERS. Behaviour is shared.
# ───────────────────────────────────────────────────────────────────────────
