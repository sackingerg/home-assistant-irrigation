captive_portal:
# Board: ESP32-S3 DevKitC-1 (Espressif)
# Definition: definitions/boards/esp32-s3-devkitc-1/manifest.yaml

# --- Per-zone duration numbers ---
# HA sets a zone's duration (in minutes) immediately before turning the
# switch on. The switch's on_turn_on automation reads this value and runs for
# exactly that many minutes before auto-offing. Default 0 means the firmware
# carries no hardcoded run times — a zone will not open unless HA provides
# a duration greater than zero.
#
# restore_value: false — duration resets to 0 on every reboot. A zone HA
# has not re-armed after a restart will refuse to open.
#
# Expected HA entity IDs (verify in Settings → Devices after flashing):
#   number.outside_irrigation_west1_controller_zone_1_duration
#   number.outside_irrigation_west1_controller_zone_2_duration
#   number.outside_irrigation_west1_controller_zone_3_duration
#   number.outside_irrigation_west1_controller_zone_4_duration
#   number.outside_irrigation_west1_controller_zone_5_duration
#   number.outside_irrigation_west1_controller_zone_6_duration

number:
  - platform: template
    name: "Zone 1 Duration"
    id: zone1_duration
    min_value: 0
    max_value: 240
    step: 1
    unit_of_measurement: min
    initial_value: 0
    optimistic: true
    restore_value: false

  - platform: template
    name: "Zone 2 Duration"
    id: zone2_duration
    min_value: 0
    max_value: 240
    step: 1
    unit_of_measurement: min
    initial_value: 0
    optimistic: true
    restore_value: false

  - platform: template
    name: "Zone 3 Duration"
    id: zone3_duration
    min_value: 0
    max_value: 240
    step: 1
    unit_of_measurement: min
    initial_value: 0
    optimistic: true
    restore_value: false

  - platform: template
    name: "Zone 4 Duration"
    id: zone4_duration
    min_value: 0
    max_value: 240
    step: 1
    unit_of_measurement: min
    initial_value: 0
    optimistic: true
    restore_value: false

  - platform: template
    name: "Zone 5 Duration"
    id: zone5_duration
    min_value: 0
    max_value: 240
    step: 1
    unit_of_measurement: min
    initial_value: 0
    optimistic: true
    restore_value: false

  - platform: template
    name: "Zone 6 Duration"
    id: zone6_duration
    min_value: 0
    max_value: 240
    step: 1
    unit_of_measurement: min
    initial_value: 0
    optimistic: true
    restore_value: false

# --- Relay outputs ---
# Irrigation West 1 covers old controller stations 1-6. Wire-for-wire 1:1
# mapping — old station N lands on this board's terminal N (GPIO N).
#
# Zone areas identified from property map (property_sprinkler_map.jpg):
# Station 1 (terminal 1): south-center, heads running south toward property line
# Station 2 (terminal 2): south-center, parallel to station 1
# Station 3 (terminal 3): south-center going south
# Station 4 (terminal 4): southwest area (blue line on map)
# Station 5 (terminal 5): west-center (orange line on map)
# Station 6 (terminal 6): far west property edge (long purple line on map)
#
# GPM per station (surveyed): 16 / 16 / 10 / 16 / 10 / 16.
# The live figures are input_number helpers in HA, not constants here.
#
# DURATION POLICY: HA sets each zone's duration number before turning the
# switch on. If that number is 0 (the boot default), the zone is rejected
# immediately and will not run. If > 0, the zone runs for exactly that many
# minutes, then auto-offs. HA may also send an explicit switch.turn_off at
# any time as a stop signal.
#
# INTERLOCK POLICY: max 2 of THIS board's zones open simultaneously.
# This is a local backstop only — the real property-wide <=20 GPM total
# across ALL controllers is a pending HA schedule_reactor task, not handled
# in firmware. West 1 and West 2 are separate devices and cannot see each
# other's zone states at the firmware level.

switch:
  - platform: gpio
    id: zone1
    name: "Zone 1 - South Center A"
    pin:
      number: GPIO1
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - if:
          condition:
            lambda: |-
              int others = 0;
              if (id(zone2).state) others++;
              if (id(zone3).state) others++;
              if (id(zone4).state) others++;
              if (id(zone5).state) others++;
              if (id(zone6).state) others++;
              return others >= 2;
          then:
            - switch.turn_off: zone1
          else:
            - if:
                condition:
                  lambda: 'return id(zone1_duration).state <= 0;'
                then:
                  - switch.turn_off: zone1
                else:
                  - delay: !lambda 'return (uint32_t)(id(zone1_duration).state * 60000);'
                  - switch.turn_off: zone1

  - platform: gpio
    id: zone2
    name: "Zone 2 - South Center B"
    pin:
      number: GPIO2
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - if:
          condition:
            lambda: |-
              int others = 0;
              if (id(zone1).state) others++;
              if (id(zone3).state) others++;
              if (id(zone4).state) others++;
              if (id(zone5).state) others++;
              if (id(zone6).state) others++;
              return others >= 2;
          then:
            - switch.turn_off: zone2
          else:
            - if:
                condition:
                  lambda: 'return id(zone2_duration).state <= 0;'
                then:
                  - switch.turn_off: zone2
                else:
                  - delay: !lambda 'return (uint32_t)(id(zone2_duration).state * 60000);'
                  - switch.turn_off: zone2

  - platform: gpio
    id: zone3
    name: "Zone 3 - South Center C"
    pin:
      number: GPIO41
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - if:
          condition:
            lambda: |-
              int others = 0;
              if (id(zone1).state) others++;
              if (id(zone2).state) others++;
              if (id(zone4).state) others++;
              if (id(zone5).state) others++;
              if (id(zone6).state) others++;
              return others >= 2;
          then:
            - switch.turn_off: zone3
          else:
            - if:
                condition:
                  lambda: 'return id(zone3_duration).state <= 0;'
                then:
                  - switch.turn_off: zone3
                else:
                  - delay: !lambda 'return (uint32_t)(id(zone3_duration).state * 60000);'
                  - switch.turn_off: zone3

  - platform: gpio
    id: zone4
    name: "Zone 4 - Southwest"
    pin:
      number: GPIO42
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - if:
          condition:
            lambda: |-
              int others = 0;
              if (id(zone1).state) others++;
              if (id(zone2).state) others++;
              if (id(zone3).state) others++;
              if (id(zone5).state) others++;
              if (id(zone6).state) others++;
              return others >= 2;
          then:
            - switch.turn_off: zone4
          else:
            - if:
                condition:
                  lambda: 'return id(zone4_duration).state <= 0;'
                then:
                  - switch.turn_off: zone4
                else:
                  - delay: !lambda 'return (uint32_t)(id(zone4_duration).state * 60000);'
                  - switch.turn_off: zone4

  - platform: gpio
    id: zone5
    name: "Zone 5 - West Center"
    pin:
      number: GPIO45
      ignore_strapping_warning: true   # GPIO45 is a strapping pin; safe as relay output
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - if:
          condition:
            lambda: |-
              int others = 0;
              if (id(zone1).state) others++;
              if (id(zone2).state) others++;
              if (id(zone3).state) others++;
              if (id(zone4).state) others++;
              if (id(zone6).state) others++;
              return others >= 2;
          then:
            - switch.turn_off: zone5
          else:
            - if:
                condition:
                  lambda: 'return id(zone5_duration).state <= 0;'
                then:
                  - switch.turn_off: zone5
                else:
                  - delay: !lambda 'return (uint32_t)(id(zone5_duration).state * 60000);'
                  - switch.turn_off: zone5

  - platform: gpio
    id: zone6
    name: "Zone 6 - Far West Edge"
    pin:
      number: GPIO46
      ignore_strapping_warning: true   # GPIO46 is a strapping pin; safe as relay output
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - if:
          condition:
            lambda: |-
              int others = 0;
              if (id(zone1).state) others++;
              if (id(zone2).state) others++;
              if (id(zone3).state) others++;
              if (id(zone4).state) others++;
              if (id(zone5).state) others++;
              return others >= 2;
          then:
            - switch.turn_off: zone6
          else:
            - if:
                condition:
                  lambda: 'return id(zone6_duration).state <= 0;'
                then:
                  - switch.turn_off: zone6
                else:
                  - delay: !lambda 'return (uint32_t)(id(zone6_duration).state * 60000);'
                  - switch.turn_off: zone6

# --- Onboard status RGB LED ---
# Waveshare ESP32-S3-Relay-6CH(B) onboard addressable (WS2812) RGB LED.
# Mirrors whichever zone is currently open: blinks N times (N = zone number)
# followed by a pause, repeating for as long as that zone stays open.
# Recalculated on every zone on/off — cannot go stale.
#
# GPIO38 and rgb_order RGB (not GRB) confirmed on the east board (2026-06-20).
# Re-verify on this specific board before trusting.
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    pin: GPIO38
    num_leds: 1
    rgb_order: RGB
    chipset: WS2812
    name: "Status LED"
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s

globals:
  - id: rgb_active_mask
    type: int
    restore_value: false
    initial_value: '0'
    # Bitmask bit0=zone1 ... bit5=zone6.

# DRIVE METHOD: 1s interval poll + bitmask, NOT on_turn_on/on_turn_off triggers.
# on_turn_off fires synchronously during setup() before the RMT light component
# is ready, causing a boot crash with restore_mode: ALWAYS_OFF. Polling via
# interval only runs after all components have finished setup().
interval:
  - interval: 1s
    then:
      - lambda: |-
          int new_mask = 0;
          if (id(zone1).state) new_mask |= 1;
          if (id(zone2).state) new_mask |= 2;
          if (id(zone3).state) new_mask |= 4;
          if (id(zone4).state) new_mask |= 8;
          if (id(zone5).state) new_mask |= 16;
          if (id(zone6).state) new_mask |= 32;
          if (new_mask != id(rgb_active_mask)) {
            id(rgb_active_mask) = new_mask;
            id(blink_status_led).stop();
            id(status_led).turn_off().perform();
            if (new_mask != 0) {
              id(blink_status_led).execute();
            }
          }

script:
  - id: blink_status_led
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return id(rgb_active_mask) != 0;'
          then:
            - if:
                condition:
                  lambda: 'return id(rgb_active_mask) & 1;'
                then:
                  - repeat:
                      count: 1
                      then:
                        - light.turn_on: {id: status_led, brightness: 30%, red: 0.0, green: 1.0, blue: 0.0, transition_length: 0s}
                        - delay: 250ms
                        - light.turn_off: {id: status_led, transition_length: 0s}
                        - delay: 250ms
                  - delay: 400ms
            - if:
                condition:
                  lambda: 'return id(rgb_active_mask) & 2;'
                then:
                  - repeat:
                      count: 2
                      then:
                        - light.turn_on: {id: status_led, brightness: 30%, red: 0.0, green: 1.0, blue: 0.0, transition_length: 0s}
                        - delay: 250ms
                        - light.turn_off: {id: status_led, transition_length: 0s}
                        - delay: 250ms
                  - delay: 400ms
            - if:
                condition:
                  lambda: 'return id(rgb_active_mask) & 4;'
                then:
                  - repeat:
                      count: 3
                      then:
                        - light.turn_on: {id: status_led, brightness: 30%, red: 0.0, green: 1.0, blue: 0.0, transition_length: 0s}
                        - delay: 250ms
                        - light.turn_off: {id: status_led, transition_length: 0s}
                        - delay: 250ms
                  - delay: 400ms
            - if:
                condition:
                  lambda: 'return id(rgb_active_mask) & 8;'
                then:
                  - repeat:
                      count: 4
                      then:
                        - light.turn_on: {id: status_led, brightness: 30%, red: 0.0, green: 1.0, blue: 0.0, transition_length: 0s}
                        - delay: 250ms
                        - light.turn_off: {id: status_led, transition_length: 0s}
                        - delay: 250ms
                  - delay: 400ms
            - if:
                condition:
                  lambda: 'return id(rgb_active_mask) & 16;'
                then:
                  - repeat:
                      count: 5
                      then:
                        - light.turn_on: {id: status_led, brightness: 30%, red: 0.0, green: 1.0, blue: 0.0, transition_length: 0s}
                        - delay: 250ms
                        - light.turn_off: {id: status_led, transition_length: 0s}
                        - delay: 250ms
                  - delay: 400ms
            - if:
                condition:
                  lambda: 'return id(rgb_active_mask) & 32;'
                then:
                  - repeat:
                      count: 6
                      then:
                        - light.turn_on: {id: status_led, brightness: 30%, red: 0.0, green: 1.0, blue: 0.0, transition_length: 0s}
                        - delay: 250ms
                        - light.turn_off: {id: status_led, transition_length: 0s}
                        - delay: 250ms
                  - delay: 400ms
            - delay: 700ms

# NOTE: verify relay polarity jumper (item 20 in Waveshare diagram) on this
# board before trusting restore_mode: ALWAYS_OFF = valve closed.

sensor:
  - platform: wifi_signal
    name: "Irrigation West1 WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Irrigation West1 Uptime"

text_sensor:
  - platform: version
    name: "Irrigation West1 ESPHome Version"
