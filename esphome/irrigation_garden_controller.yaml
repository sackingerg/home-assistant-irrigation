# Board: ESP32-S3 DevKitC-1 (Espressif)
# Definition: definitions/boards/esp32-s3-devkitc-1/manifest.yaml

esphome:
  name: irrigation_garden_controller
  friendly_name: Irrigation_Garden_Controller

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "REPLACE_WITH_YOUR_OWN_32_BYTE_BASE64_KEY"

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: !secret wifi_ssid
    password: "REPLACE_WITH_YOUR_OWN_AP_PASSWORD"

captive_portal:

# --- Per-zone duration numbers ---
# HA sets a zone's duration (in minutes) immediately before turning the
# switch on. The switch's on_turn_on automation reads this value and runs for
# exactly that many minutes before auto-offing. Default 0 means the firmware
# carries no hardcoded run times — a zone will not open unless HA provides
# a duration greater than zero.
#
# restore_value: false — duration resets to 0 on every reboot. A zone HA
# has not re-armed after a restart will refuse to open.
#
# Expected HA entity IDs (verify in Settings → Devices after flashing):
#   number.outside_irrigation_garden_controller_zone_1_duration
#   number.outside_irrigation_garden_controller_zone_2_duration
#   number.outside_irrigation_garden_controller_zone_3_duration

number:
  - platform: template
    name: "Zone 1 Duration"
    id: zone1_duration
    min_value: 0
    max_value: 240
    step: 1
    unit_of_measurement: min
    initial_value: 0
    optimistic: true
    restore_value: false

  - platform: template
    name: "Zone 2 Duration"
    id: zone2_duration
    min_value: 0
    max_value: 240
    step: 1
    unit_of_measurement: min
    initial_value: 0
    optimistic: true
    restore_value: false

  - platform: template
    name: "Zone 3 Duration"
    id: zone3_duration
    min_value: 0
    max_value: 240
    step: 1
    unit_of_measurement: min
    initial_value: 0
    optimistic: true
    restore_value: false

# --- Relay outputs ---
# Garden & Raised Bed controller - north side of house. 3 stations:
# strawberries, blueberry/blackberry bed (combined to 1 line), dripper
# system. Using terminal blocks 1, 2, and 3 only (confirmed 2026-06-23);
# channels 4-6 on this board are spare/unused.
#
# Estimated GPM (not yet measured): strawberries 1, blueberry/blackberry 8,
# dripper 10. All three combined = 19 GPM, at or under the property's 20 GPM
# pump ceiling on their own. The max-2-of-3 check below is a local backstop
# against a scheduling bug — it is NOT what keeps the whole property under
# 20 GPM.
#
# DURATION POLICY: HA sets each zone's duration number before turning the
# switch on. If that number is 0 (the boot default), the zone is rejected
# immediately and will not run. If > 0, the zone runs for exactly that many
# minutes, then auto-offs. HA may also send an explicit switch.turn_off at
# any time as a stop signal.

switch:
  - platform: gpio
    id: zone1
    name: "Zone 1 - Strawberries"
    pin:
      number: GPIO1
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - if:
          condition:
            lambda: |-
              int others = 0;
              if (id(zone2).state) others++;
              if (id(zone3).state) others++;
              return others >= 2;
          then:
            - switch.turn_off: zone1
          else:
            - if:
                condition:
                  lambda: 'return id(zone1_duration).state <= 0;'
                then:
                  - switch.turn_off: zone1
                else:
                  - delay: !lambda 'return (uint32_t)(id(zone1_duration).state * 60000);'
                  - switch.turn_off: zone1

  - platform: gpio
    id: zone2
    name: "Zone 2 - Blueberry-Blackberry Bed"
    pin:
      number: GPIO2
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - if:
          condition:
            lambda: |-
              int others = 0;
              if (id(zone1).state) others++;
              if (id(zone3).state) others++;
              return others >= 2;
          then:
            - switch.turn_off: zone2
          else:
            - if:
                condition:
                  lambda: 'return id(zone2_duration).state <= 0;'
                then:
                  - switch.turn_off: zone2
                else:
                  - delay: !lambda 'return (uint32_t)(id(zone2_duration).state * 60000);'
                  - switch.turn_off: zone2

  - platform: gpio
    id: zone3
    name: "Zone 3 - Dripper System"
    pin:
      number: GPIO41
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - if:
          condition:
            lambda: |-
              int others = 0;
              if (id(zone1).state) others++;
              if (id(zone2).state) others++;
              return others >= 2;
          then:
            - switch.turn_off: zone3
          else:
            - if:
                condition:
                  lambda: 'return id(zone3_duration).state <= 0;'
                then:
                  - switch.turn_off: zone3
                else:
                  - delay: !lambda 'return (uint32_t)(id(zone3_duration).state * 60000);'
                  - switch.turn_off: zone3

# --- Onboard status RGB LED ---
# Waveshare ESP32-S3-Relay-6CH(B) onboard addressable (WS2812) RGB LED.
# Mirrors whichever zone is currently open: blinks N times (N = zone number)
# followed by a pause, repeating for as long as that zone stays open.
# Recalculated on every zone on/off — whether triggered by HA, the dashboard,
# or the auto-off delays above — so it can never go stale.
#
# PIN/COLOR NOTES carried over from the east (same board family): GPIO38
# confirmed correct by physical test on the east (2026-06-20) - LED lights
# when driven from HA. rgb_order is RGB, not the WS2812-standard GRB - the
# east's board showed red when commanded pure green under GRB, confirming
# it's wired/labeled non-standard. Re-verify both by physical test on THIS
# board before trusting them - not yet confirmed on this specific unit.
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    pin: GPIO38
    num_leds: 1
    rgb_order: RGB
    chipset: WS2812
    name: "Status LED"
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s

globals:
  - id: rgb_active_mask
    type: int
    restore_value: false
    initial_value: '0'
    # Bitmask, bit0=zone1, bit1=zone2, bit2=zone3 (3 zones on this
    # controller, vs. the east's 6 - same pattern, fewer bits used).

# DRIVE METHOD NOTE: the blink pattern is driven by a 1s interval poll below,
# NOT by switch on_turn_on/on_turn_off triggers. On the east, an earlier
# version wired refresh_status_led directly into each zone switch's
# on_turn_on/on_turn_off, and that crashed the device on every boot -
# restore_mode: ALWAYS_OFF forces each switch to its off state during the
# switch's own setup(), which appears to fire the on_turn_off automation
# synchronously, before the light component's RMT channel had finished
# initializing. Calling light.turn_off on a not-yet-ready light component
# triggered a boot failure, which ESPHome's safe_mode watchdog silently
# rolled back every single time - hence nothing ever appeared to take
# effect no matter what was changed. Polling via interval: only ever runs
# after all components have finished setup(), so it sidesteps that ordering
# hazard entirely.
# The interval's lambda only touches the light/restarts the blink when the
# active SET of zones actually CHANGES (compares the new bitmask against the
# previous value of the global before overwriting it). Without that guard,
# every 1s tick would force-restart blink_status_led mid-pattern, and the LED
# would never complete a clean rotation - it would just stutter.
#
# This same zoneN.state polling pattern is reused above in each zone's
# on_turn_on max-2 check - both read live switch states rather than
# maintaining separate counters, for the same desync-avoidance reason.
interval:
  - interval: 1s
    then:
      - lambda: |-
          int new_mask = 0;
          if (id(zone1).state) new_mask |= 1;
          if (id(zone2).state) new_mask |= 2;
          if (id(zone3).state) new_mask |= 4;
          if (new_mask != id(rgb_active_mask)) {
            id(rgb_active_mask) = new_mask;
            id(blink_status_led).stop();
            id(status_led).turn_off().perform();
            if (new_mask != 0) {
              id(blink_status_led).execute();
            }
          }

# blink_status_led: cycles through every currently-active zone in turn -
# blinks zone N's number, short gap, moves to the next active zone, then a
# longer pause once it's been through all of them, then repeats the whole
# rotation for as long as rgb_active_mask stays nonzero. With only one zone
# active this degrades to exactly the old single-zone behavior (blink N,
# pause, repeat). Only (re)started by the interval above when the active set
# changes, so a rotation always runs to completion undisturbed.
script:
  - id: blink_status_led
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return id(rgb_active_mask) != 0;'
          then:
            - if:
                condition:
                  lambda: 'return id(rgb_active_mask) & 1;'
                then:
                  - repeat:
                      count: 1
                      then:
                        - light.turn_on: {id: status_led, brightness: 30%, red: 0.0, green: 1.0, blue: 0.0, transition_length: 0s}
                        - delay: 250ms
                        - light.turn_off: {id: status_led, transition_length: 0s}
                        - delay: 250ms
                  - delay: 400ms
            - if:
                condition:
                  lambda: 'return id(rgb_active_mask) & 2;'
                then:
                  - repeat:
                      count: 2
                      then:
                        - light.turn_on: {id: status_led, brightness: 30%, red: 0.0, green: 1.0, blue: 0.0, transition_length: 0s}
                        - delay: 250ms
                        - light.turn_off: {id: status_led, transition_length: 0s}
                        - delay: 250ms
                  - delay: 400ms
            - if:
                condition:
                  lambda: 'return id(rgb_active_mask) & 4;'
                then:
                  - repeat:
                      count: 3
                      then:
                        - light.turn_on: {id: status_led, brightness: 30%, red: 0.0, green: 1.0, blue: 0.0, transition_length: 0s}
                        - delay: 250ms
                        - light.turn_off: {id: status_led, transition_length: 0s}
                        - delay: 250ms
                  - delay: 400ms
            - delay: 700ms

# NOTE: board has a jumper (item 20 in Waveshare's diagram, "Relays default
# control pin setting") that determines whether GPIO HIGH = relay ON or OFF.
# Confirmed correct (no inverted: true needed) on the east's board - not
# yet re-verified on this specific board, do that before trusting it.

# --- Diagnostics, optional but cheap to have ---
sensor:
  - platform: wifi_signal
    name: "Irrigation Garden Controller WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Irrigation Garden Controller Uptime"

text_sensor:
  - platform: version
    name: "Irrigation Garden Controller ESPHome Version"
