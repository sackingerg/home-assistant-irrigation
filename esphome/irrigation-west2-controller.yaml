      - component.update: zone4_remaining

  - platform: gpio
    id: zone5
    name: "Zone 5 - Station 11"
    pin:
      number: GPIO45
      ignore_strapping_warning: true   # GPIO45 is a strapping pin; safe as relay output
    restore_mode: ALWAYS_OFF
    on_turn_on:
