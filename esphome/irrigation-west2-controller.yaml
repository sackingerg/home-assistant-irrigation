# ═════════════════════════════════════════════════════════════════════════════
# VERSION: 2.02  (2026-08-17)
#
#   2.02  Time Remaining: 60 s interval instead of 10 s (run lengths are whole
#         minutes, so 10 s over-sampled), plus component.update on start,
#         reset and stop so those transitions are immediate rather than polled.
#   2.01  delta: 1 filter on Time Remaining — an idle zone no longer republishes
#         the same 0 every interval. Six identical log lines per board per 10 s.
#   2.00  Countdown moved out of an inline `delay:` in on_turn_on and into a
#         per-zone `mode: restart` script driven by the duration number's
#         on_value. Re-arming a RUNNING zone now restarts its countdown in
#         place instead of doing nothing. Adds a Time Remaining sensor per zone
#         and a Config Revision text sensor. Shared file: esphome/zone_timer.yaml.
#   1.00  Original — auto-off was an inline `delay:` read once at valve-open.
#         The duration number was inert for the rest of the run.
#
# VERSIONING RULE: any modification to this file bumps VERSION by >= 0.01, bug
# fixes included. The Config Revision text sensor below must be bumped to match
# in the same edit — a header comment describes the FILE, the sensor describes
# what is actually running on the CHIP. Three installs on 2026-08-17 silently
# flashed the old build because nothing reported the latter.
# ═════════════════════════════════════════════════════════════════════════════
# Board: Generic ESP32-S3 Board (Generic)
# Definition: definitions/boards/generic-esp32s3/manifest.yaml

esphome:
  name: irrigation_west2_controller
  friendly_name: Irrigation_West2_Controller

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "REPLACE_WITH_YOUR_OWN_32_BYTE_BASE64_KEY"

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: irrigation_west Fallback Hotspot
    password: "REPLACE_WITH_YOUR_OWN_AP_PASSWORD"

captive_portal:
# --- Per-zone timers -------------------------------------------------------
# Each zone's duration number, countdown script, remaining-time sensor and
# deadline global all come from ONE shared definition: esphome/zone_timer.yaml.
# Included once per zone below, so all 21 zones across all four controllers
# share a single implementation instead of 21 hand-maintained copies.
#
# `zlabel` reproduces the pre-existing entity names EXACTLY — changing it
# would move the HA entity_ids and silently break every map and dashboard
# reference. Expected HA entity IDs after flashing:
#   number.outside_irrigation_west2_controller_zone_1_duration
#   number.outside_irrigation_west2_controller_zone_2_duration
#   number.outside_irrigation_west2_controller_zone_3_duration
#   number.outside_irrigation_west2_controller_zone_4_duration
#   number.outside_irrigation_west2_controller_zone_5_duration
#   number.outside_irrigation_west2_controller_zone_6_duration
#   ...and one sensor.outside_<node>_<zone>_time_remaining per zone (NEW).

packages:
  zone1_timer: !include {file: zone_timer.yaml, vars: {zid: zone1, zlabel: "Zone 1"}}
  zone2_timer: !include {file: zone_timer.yaml, vars: {zid: zone2, zlabel: "Zone 2"}}
  zone3_timer: !include {file: zone_timer.yaml, vars: {zid: zone3, zlabel: "Zone 3"}}
  zone4_timer: !include {file: zone_timer.yaml, vars: {zid: zone4, zlabel: "Zone 4"}}
  zone5_timer: !include {file: zone_timer.yaml, vars: {zid: zone5, zlabel: "Zone 5"}}
  zone6_timer: !include {file: zone_timer.yaml, vars: {zid: zone6, zlabel: "Zone 6"}}

switch:
  - platform: gpio
    id: zone1
    name: "Zone 1 - Near Shed"
    pin:
      number: GPIO1
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - if:
          condition:
            lambda: |-
              int others = 0;
              if (id(zone2).state) others++;
              if (id(zone3).state) others++;
              if (id(zone4).state) others++;
              if (id(zone5).state) others++;
              if (id(zone6).state) others++;
              return others >= 2;
          then:
            - switch.turn_off: zone1
          else:
            - if:
                condition:
                  lambda: 'return id(zone1_duration).state <= 0;'
                then:
                  - switch.turn_off: zone1
                else:
                  - script.execute: zone1_autooff
    on_turn_off:
      # A stop must cancel the pending countdown, not leave it armed to
      # fire later and close a subsequent run early.
      - script.stop: zone1_autooff
      - lambda: 'id(zone1_end_ms) = 0;'
      - component.update: zone1_remaining

  - platform: gpio
    id: zone2
    name: "Zone 2 - North of House"
    pin:
      number: GPIO2
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - if:
          condition:
            lambda: |-
              int others = 0;
              if (id(zone1).state) others++;
              if (id(zone3).state) others++;
              if (id(zone4).state) others++;
              if (id(zone5).state) others++;
              if (id(zone6).state) others++;
              return others >= 2;
          then:
            - switch.turn_off: zone2
          else:
            - if:
                condition:
                  lambda: 'return id(zone2_duration).state <= 0;'
                then:
