  - platform: gpio
    id: zone6
    name: "Zone 6 - Center West"
    pin:
      number: GPIO46
      ignore_strapping_warning: true   # GPIO46 is a strapping pin; safe as relay output
    restore_mode: ALWAYS_OFF
