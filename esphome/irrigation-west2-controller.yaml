  - platform: gpio
    id: zone4
    name: "Zone 4 - Far West"
    pin:
      number: GPIO42
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - if:
          condition:
            lambda: |-
              int others = 0;
              if (id(zone1).state) others++;
              if (id(zone2).state) others++;
              if (id(zone3).state) others++;
              if (id(zone5).state) others++;
              if (id(zone6).state) others++;
              return others >= 2;
          then:
            - switch.turn_off: zone4
          else:
            - if:
                condition:
