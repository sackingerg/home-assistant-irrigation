# --- Onboard status RGB LED ---
# Waveshare ESP32-S3-Relay-6CH(B) onboard addressable (WS2812) RGB LED.
# Mirrors whichever zone is currently open: blinks N times (N = zone number)
# followed by a pause, repeating for as long as that zone stays open.
# Recalculated on every zone on/off - whether triggered by HA, the dashboard,
# or the auto-off delays above - so it can never go stale.
#
# PIN NOTE: GPIO38 confirmed correct by physical test (2026-06-20) - LED
# lights when driven from HA. Do not change this pin without re-testing.
# COLOR NOTE: rgb_order is RGB, not the WS2812-standard GRB - this board's
# chip showed red when commanded pure green under GRB, confirming it's wired/
# labeled non-standard. Confirmed correct with RGB (2026-06-20).
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    pin: GPIO38
    num_leds: 1
    rgb_order: RGB
    chipset: WS2812
    name: "Status LED"
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s

globals:
  - id: rgb_active_mask
    type: int
    restore_value: false
    initial_value: '0'
    # Bitmask, bit0=zone1 ... bit5=zone6. Replaced the old single "lowest
    # active zone" int (2026-06-23) once multiple zones could legitimately
    # be on at once (see the max-2 policy on the switches above) - a single
    # int could only ever represent one zone, silently hiding any other zone
    # that was also running.

# DRIVE METHOD NOTE: the blink pattern is driven by a 1s interval poll below,
# NOT by switch on_turn_on/on_turn_off triggers. An earlier version wired
# refresh_status_led directly into each zone switch's on_turn_on/on_turn_off,
# and that crashed the device on every boot - restore_mode: ALWAYS_OFF forces
# each switch to its off state during the switch's own setup(), which appears
# to fire the on_turn_off automation synchronously, before the light
# component's RMT channel had finished initializing. Calling light.turn_off
# on a not-yet-ready light component triggered a boot failure, which
# ESPHome's safe_mode watchdog silently rolled back every single time -
# hence nothing ever appeared to take effect no matter what was changed.
# Polling via interval: only ever runs after all components have finished
# setup(), so it sidesteps that ordering hazard entirely.
# The interval's lambda only touches the light/restarts the blink when the
# active SET of zones actually CHANGES (compares the new bitmask against the
# previous value of the global before overwriting it). Without that guard,
# every 1s tick would force-restart blink_status_led mid-pattern, and the LED
# would never complete a clean rotation - it would just stutter.
#
# NOTE (2026-06-23): this same zoneN.state polling pattern is reused above in
# each zone's on_turn_on max-2 check - both read live switch states rather
# than maintaining separate counters, for the same desync-avoidance reason.
interval:
  - interval: 1s
    then:
      - lambda: |-
          int new_mask = 0;
          if (id(zone1).state) new_mask |= 1;
          if (id(zone2).state) new_mask |= 2;
          if (id(zone3).state) new_mask |= 4;
          if (id(zone4).state) new_mask |= 8;
          if (id(zone5).state) new_mask |= 16;
          if (id(zone6).state) new_mask |= 32;
          if (new_mask != id(rgb_active_mask)) {
            id(rgb_active_mask) = new_mask;
            id(blink_status_led).stop();
            id(status_led).turn_off().perform();
            if (new_mask != 0) {
              id(blink_status_led).execute();
            }
          }

# blink_status_led: cycles through every currently-active zone in turn -
# blinks zone N's number, short gap, moves to the next active zone, then a
# longer pause once it's been through all of them, then repeats the whole
# rotation for as long as rgb_active_mask stays nonzero. With only one zone
# active this degrades to exactly the old single-zone behavior (blink N,
# pause, repeat). Only (re)started by the interval above when the active set
# changes, so a rotation always runs to completion undisturbed.
script:
  - id: blink_status_led
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return id(rgb_active_mask) != 0;'
          then:
            - if:
                condition:
                  lambda: 'return id(rgb_active_mask) & 1;'
                then:
                  - repeat:
                      count: 1
                      then:
                        - light.turn_on: {id: status_led, brightness: 30%, red: 0.0, green: 1.0, blue: 0.0, transition_length: 0s}
                        - delay: 250ms
                        - light.turn_off: {id: status_led, transition_length: 0s}
                        - delay: 250ms
                  - delay: 400ms
            - if:
                condition:
                  lambda: 'return id(rgb_active_mask) & 2;'
                then:
                  - repeat:
                      count: 2
                      then:
                        - light.turn_on: {id: status_led, brightness: 30%, red: 0.0, green: 1.0, blue: 0.0, transition_length: 0s}
                        - delay: 250ms
                        - light.turn_off: {id: status_led, transition_length: 0s}
                        - delay: 250ms
                  - delay: 400ms
            - if:
                condition:
                  lambda: 'return id(rgb_active_mask) & 4;'
                then:
                  - repeat:
                      count: 3
                      then:
                        - light.turn_on: {id: status_led, brightness: 30%, red: 0.0, green: 1.0, blue: 0.0, transition_length: 0s}
                        - delay: 250ms
                        - light.turn_off: {id: status_led, transition_length: 0s}
                        - delay: 250ms
                  - delay: 400ms
            - if:
                condition:
                  lambda: 'return id(rgb_active_mask) & 8;'
                then:
                  - repeat:
                      count: 4
                      then:
                        - light.turn_on: {id: status_led, brightness: 30%, red: 0.0, green: 1.0, blue: 0.0, transition_length: 0s}
                        - delay: 250ms
                        - light.turn_off: {id: status_led, transition_length: 0s}
                        - delay: 250ms
                  - delay: 400ms
            - if:
                condition:
                  lambda: 'return id(rgb_active_mask) & 16;'
                then:
                  - repeat:
                      count: 5
                      then:
                        - light.turn_on: {id: status_led, brightness: 30%, red: 0.0, green: 1.0, blue: 0.0, transition_length: 0s}
                        - delay: 250ms
                        - light.turn_off: {id: status_led, transition_length: 0s}
                        - delay: 250ms
                  - delay: 400ms
            - if:
                condition:
                  lambda: 'return id(rgb_active_mask) & 32;'
                then:
                  - repeat:
                      count: 6
                      then:
                        - light.turn_on: {id: status_led, brightness: 30%, red: 0.0, green: 1.0, blue: 0.0, transition_length: 0s}
                        - delay: 250ms
                        - light.turn_off: {id: status_led, transition_length: 0s}
                        - delay: 250ms
                  - delay: 400ms
            - delay: 700ms

# NOTE: board has a jumper (item 20 in Waveshare's diagram, "Relays default
# control pin setting") that determines whether GPIO HIGH = relay ON or OFF.
# Polarity already verified correct (2026-06-19) - no inverted: true needed.

# --- Diagnostics, optional but cheap to have ---
sensor:
  - platform: wifi_signal
    name: "Irrigation East WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Irrigation East Uptime"

# --- Build marker ------------------------------------------------------------
# Publishes the revision above as an HA entity so "which build is actually
# flashed?" is answerable without guessing. Rev 1 has no such entity, so its
# absence is itself the answer.
text_sensor:
  - platform: template
    name: "Config Revision"
    id: config_revision
    icon: mdi:tag-check
    update_interval: 300s
    lambda: 'return {"2.02"};'

  - platform: version
    name: "Irrigation East ESPHome Version"
